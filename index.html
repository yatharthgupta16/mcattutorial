<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Relative, not root-absolute: "/favicon.png" would 404 on GitHub Pages, where the
         site is served from the /mcattutorial/ subpath. This form works there and on Vercel. -->
    <link rel="icon" type="image/png" href="favicon.png" />
    <link rel="apple-touch-icon" href="favicon.png" />
    <!-- viewport-fit=cover lets section backgrounds run edge-to-edge on notched
         phones; .container-page pads content back off the notch via safe-area insets. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>NorthStar Med — Personalized Online MCAT Coaching</title>
    <meta
      name="description"
      content="Personalized online MCAT coaching for medical school applicants. One-on-one tutoring, customized study plans, question and passage analysis, and ongoing mentorship."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <!-- Calendly popup widget, opened by BookingLink. Loaded async: the booking
         buttons keep a real href, so they still work before this arrives.
         calendly.com is preconnected too — that host isn't hit until a CTA is
         clicked, so warming DNS/TLS early takes setup off the popup's critical path. -->
    <link rel="preconnect" href="https://assets.calendly.com" />
    <link rel="preconnect" href="https://calendly.com" />
    <!-- media="print" then swapped on load: this stylesheet only styles the popup
         overlay, so letting it block first paint costs every visitor ~2.5s for markup
         that most of them never see. No noscript fallback needed — without JS the
         popup never opens and BookingLink just navigates to Calendly instead. -->
    <link
      href="https://assets.calendly.com/assets/external/widget.css"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <script src="https://assets.calendly.com/assets/external/widget.js" async></script>
    <script type="module" crossorigin src="/mcattutorial/assets/index-C4CPWwoY.js"></script>
    <link rel="stylesheet" crossorigin href="/mcattutorial/assets/index-M9Whsseo.css">
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
